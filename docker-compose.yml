services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usa_job_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/usa_job_portal
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
volumes:
  postgres_data:
